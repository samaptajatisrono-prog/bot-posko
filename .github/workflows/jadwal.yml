name: Auto Input Posko PBM 24 Jam

on:
  schedule:
    # Jam 08:15 WIB (01:15 UTC) -> Otomatis Input Patroli Siang + DIMTAQ
    - cron: '15 1 * * *'
    # Jam 20:15 WIB (13:15 UTC) -> Otomatis Input Patroli Malam
    - cron: '15 13 * * *'
  
  # Bisa juga dipencet manual kapan saja dari aplikasi GitHub di HP
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pilih Mode Laporan (siang / malam / dimtaq)'
        required: true
        default: 'siang'

jobs:
  jalankan-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright & Library
        run: |
          pip install playwright requests
          playwright install chromium --with-deps

      - name: Jalankan Robot Posko PBM
        env:
          POSKO_EMAIL: ${{ secrets.POSKO_EMAIL }}
          POSKO_PASSWORD: ${{ secrets.POSKO_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python bot_posko.py ${{ github.event.inputs.mode }}
          elif [ "${{ github.event.schedule }}" = "15 13 * * *" ]; then
            python bot_posko.py malam
          else
            python bot_posko.py siang
          fi
